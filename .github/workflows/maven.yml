# This workflow will build a Java project with Maven
# For more information see: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions

name: Build and Test RESTEasy

on:
  workflow_dispatch:
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref
    || github.ref }}'
  cancel-in-progress: true

env:
  MVN_ARGS: '-V -B -fae'

jobs:
  build:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 
      'requires-spec-snapshot') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest--arm64
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      id: jdk17
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: 17
    - name: Set up JDK 21
      id: jdk21
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: 21
    - name: Set up JDK 26
      id: jdk26
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: 26
      # Please note the order here of having 25 last as that is the version we want to compile with
    - name: Set up JDK 25
      id: jdk25
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        cache: 'maven'
        java-version: 25
    - name: Build and Test on ${{ matrix.os }} - Java 25
      run: ./mvnw ${{ env.MVN_ARGS }} clean install
    - name: Build and Test on ${{ matrix.os }} - Java 26
      run: ./mvnw ${{ env.MVN_ARGS }} verify '-Dtest.java.home=${{ 
        steps.jdk26.outputs.path }}' '-Dtest.report.dir=java26'
    - name: Build and Test on ${{ matrix.os }} - Java 21
      run: ./mvnw ${{ env.MVN_ARGS }} verify '-Dtest.java.home=${{ 
        steps.jdk21.outputs.path }}' '-Dtest.report.dir=java21'
    - name: Build and Test on ${{ matrix.os }} - Java 17
      run: ./mvnw ${{ env.MVN_ARGS }} verify '-Dtest.java.home=${{ 
        steps.jdk17.outputs.path }}' '-Dtest.report.dir=java17'
    - name: Upload test logs for failed run
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: failure-report-${{ matrix.os }}
        path: |
          **/surefire-reports/**
          **/failsafe-reports/**
          **/*.log

    name: build [${{ matrix.expander_leg }}]
